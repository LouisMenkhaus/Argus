[project]
name = "argus-tracker"
version = "1.3.0"
description = "Multi-camera human pose tracking and behavior analysis with health monitoring, telemetry, and a secured control API"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.black]
line-length = 100

[tool.mypy]
# 3.12: numpy's stubs use PEP 695 `type` statements, which mypy rejects
# when targeting an older interpreter.
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Repository root on sys.path so tests import the package under test directly.
pythonpath = ["."]
