name: CI

on:
  push:
  pull_request:

jobs:
  # Blocking checks. The tracking layer (core/smoothing.py) carries no
  # inference dependency, so the whole suite runs without torch/ultralytics —
  # CI finishes in about a minute instead of pulling a multi-gigabyte model
  # stack, and there is far less that can break for reasons unrelated to the
  # code under test.
  test:
    name: Tests, lint, security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          # headless OpenCV: CI has no display server
          pip install opencv-python-headless numpy PyYAML psutil
          pip install pytest pytest-cov flake8 bandit

      - name: Syntax check every module
        run: |
          python -m py_compile main.py core/*.py camera/*.py api/*.py \
            telemetry/*.py recording/*.py benchmark/*.py scripts/*.py tests/*.py

      - name: Lint (flake8)
        run: flake8 .

      - name: Security scan (bandit)
        run: bandit -c .bandit -r .

      - name: Tests
        run: pytest -q --cov=core --cov=camera --cov=telemetry --cov-report=term-missing

  # Advisory. Type coverage is being added incrementally, so mypy reports are
  # informational rather than merge-blocking — a red badge for an un-annotated
  # helper would hide the signals that actually matter above.
  typecheck:
    name: Type check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install mypy numpy PyYAML
      - name: mypy
        run: mypy main.py core camera telemetry recording benchmark
