name: CI
on:
  push:
  pull_request:
jobs:
  test-lint-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt -r requirements.txt -r requirements-api.txt
      - name: Lint (flake8)
        run: flake8 .
      - name: Type check (mypy)
        run: mypy main.py core api camera telemetry recording benchmark
      - name: Security scan (bandit)
        run: bandit -c .bandit -r .
      - name: Tests + coverage
        run: pytest --cov=core --cov=camera --cov=api --cov-report=term-missing
